name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # create GitHub Release + upload assets

jobs:
  build-mcpb:
    name: Build todos.mcpb
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build .mcpb
        run: uv run python build_mcpb.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/todos.mcpb

  build-wheel:
    name: Build Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  github-release:
    name: Create GitHub Release
    needs: [build-mcpb, build-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "todos v${{ needs.build-mcpb.outputs.version }}"
          body: |
            ## Instalação rápida

            **Claude Desktop (.mcpb — duplo-clique para instalar):**
            Baixe `todos.mcpb` abaixo e abra com duplo-clique. O Claude Desktop instala automaticamente e pede suas credenciais.

            **Wheel (pip):**
            Baixe o `.whl` anexado abaixo e instale com `pip install todos_sei-${{ needs.build-mcpb.outputs.version }}-py3-none-any.whl`.
          files: |
            dist/todos.mcpb
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: false
