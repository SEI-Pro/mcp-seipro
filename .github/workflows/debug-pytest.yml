name: Temporary PR 138 Routing Sync

on:
  pull_request:
    paths:
      - "tests/test_tool_routing.py"
      - ".github/workflows/debug-pytest.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Register generic action-plan tools as bespoke routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_tool_routing.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "# --- generico.py: inspeção/submissão genérica de form (RFC 0020, web-only) ---",
              "# --- generico.py: inspeção e planos web (RFC 0020/0023, web-only) ---",
          )
          old = '"sei_inspecionar_pagina",  # backend.inspecionar_pagina(url, ...) via _web_backend direto'
          new = '\n'.join((
              '"sei_inspecionar_pagina",  # página/planos usam o cliente web diretamente',
              '"sei_executar_plano_sei",  # plano opaco, confirmação e pós-condição são stateful',
          ))
          if old not in text:
              raise SystemExit("routing tool anchor not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tool_routing.py
          git commit -m "test: register generic action plan routing"
          git push
