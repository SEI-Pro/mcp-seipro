name: Debug Pytest Diagnostics

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "README.md"
      - "CLAUDE.md"
      - "manifest.json"
      - "pyproject.toml"
      - ".github/workflows/debug-pytest.yml"

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests and capture report
        shell: bash
        run: |
          set +e
          uv run --group dev pytest tests/ -x --tb=short > pytest-report.txt 2>&1
          status=$?
          tail -n 160 pytest-report.txt
          exit "$status"
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-final
          path: pytest-report.txt
          if-no-files-found: error
