name: Temporary PR 138 Maintenance

on:
  pull_request:
    paths:
      - "README.md"
      - "CLAUDE.md"
      - "manifest.json"
      - "pyproject.toml"
      - "src/**"
      - "tests/test_tool_count.py"
      - ".github/workflows/maintenance-pr-138.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Synchronize public tool count and format parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = (
              "README.md",
              "CLAUDE.md",
              "manifest.json",
              "src/todos/mcp_app.py",
              "pyproject.toml",
              "src/todos/server.py",
          )
          pattern = re.compile(r"\b129\s+(tools|ferramentas)\b")
          for raw in files:
              path = Path(raw)
              text = path.read_text(encoding="utf-8")
              updated = pattern.sub(r"130 \1", text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY
          uv run --group dev ruff check --fix src/todos/sei_action_plans.py
          uv run --group dev ruff format src/todos/sei_action_plans.py
      - name: Commit maintenance changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CLAUDE.md manifest.json src/todos/mcp_app.py pyproject.toml src/todos/server.py src/todos/sei_action_plans.py
          git commit -m "chore: synchronize tool count and format action plans"
          git push
