[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-seipro"
version = "0.4.1"
description = "MCP server for SEI (Sistema Eletronico de Informacoes) - 116 tools for mod-wssei v2 REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "sei", "governo", "documentos", "claude"]
dependencies = [
    # Teto em <2: o SDK 2.0.0 removeu `mcp.server.fastmcp`, de onde vêm FastMCP e
    # Context — com ele o servidor nem importa. Migrar é trabalho à parte.
    "mcp[cli]>=1.12,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4",
    "markdownify>=0.14",
    "pdfplumber>=0.10",
    "pdf2image>=1.16",
    "pytesseract>=0.3",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Transporte via browser (SEI_TRANSPORT=browser) para contornar WAF/Cloudflare.
# Após instalar: `playwright install chromium`.
browser = ["playwright>=1.40"]

[project.scripts]
mcp-seipro = "mcp_seipro.server:main"

[tool.hatch.build.targets.sdist]
include = ["src/mcp_seipro/", "pyproject.toml", "README.md"]
