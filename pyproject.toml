[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todos-sei"
dynamic = ["version"]
description = "TOdos Domina O Sei — MCP server para o SEI com 126 tools, scraper HTTP + REST híbrido e suporte a instâncias sem mod-wssei"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "sei", "governo", "documentos", "claude"]
dependencies = [
    "mcp[cli]>=1.12",
    "httpx>=0.27",
    "beautifulsoup4>=4",
    "markdownify>=0.14",
    "pdfplumber>=0.10",
    "pdf2image>=1.16",
    "pytesseract>=0.3",
    "uvicorn[standard]>=0.30",
    "fastmcp==3.4.2",
    "keyring>=25.0.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
llm = ["litellm>=1.0"]

[project.scripts]
todos = "todos.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.1a14",
    "vulture>=2.14",
    "bandit>=1.8",
    "pip-audit>=2.8",
]
eval = [
    "anthropic>=0.30",
]

[tool.hatch.version]
path = "src/todos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/todos"]

[tool.hatch.build.targets.sdist]
include = ["src/todos/", "pyproject.toml", "README.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── Formatter conflicts (ruff format owns these) ──────────────────────
    "W191", "E101",                  # tabs
    "E111", "E114", "E117",          # indentation width
    "D206", "D300",                  # docstring formatting
    "Q000", "Q001", "Q002", "Q003",  # quote style
    "COM812", "COM819",              # trailing commas
    "ISC001", "ISC002",              # implicit string concat
    "E501",                          # line length (formatter handles it)
    # ── Mutually exclusive D pairs — pick one of each ─────────────────────
    "D203",   # keep D211 (no blank line before class)
    "D213",   # keep D212 (summary on first line)
    # ── Intentional project-wide decisions ────────────────────────────────
    "CPY001",                        # no copyright headers
]

[tool.ruff.lint.per-file-ignores]
"bootstrap.py" = ["S603", "S606"]  # subprocess with controlled inputs (sys.executable, Path objects)
"setup_claude.py" = ["S603"]  # legitimate subprocess calls with trusted input
"scripts/smoke_web.py" = ["BLE001"]  # smoke test catch-all is intentional — any failure must be logged
"src/todos/setup_wizard.py" = [
    # subprocess calls use sys.executable or controlled Path objects — not shell injection
    "S603",
]
"src/todos/remote.py" = [
    "S104",  # 0.0.0.0 string comparison is intentional — detects Railway/container binding and warns
]
"src/todos/sei_web_client.py" = [
    # Scraper methods are inherently complex (multi-step web flows, branching HTML layouts)
    "C901", "PLR0912", "PLR0915",
]
"src/todos/server.py" = [
    "PLR0913",  # MCP tools need ctx + ≥4 business params; grouping into dataclasses hides the MCP schema
]
# per-domain tool modules split out of server.py: same framework-dictated MCP
# signature constraint — tools need ctx + ≥4 business params, and grouping into
# dataclasses hides the MCP schema.
# Only catalogos / documentos / processos actually trigger PLR0913; the other
# modules (acompanhamento, assinatura, blocos_*, credenciamento, marcadores,
# unidades) are clean and no longer need the suppression.
"src/todos/tools/catalogos.py" = [
    "PLR0913",  # sei_pesquisar_tipos_documento: 5 independent search/pagination params + ctx
]
"src/todos/tools/unidades.py" = [
    "PLR0913",  # sei_pesquisar_usuarios: filtro+id_orgao+limit+pagina+cursor+ctx = 6 MCP params
]
"src/todos/tools/documentos.py" = [
    "PLR0913",  # sei_criar_documento/sei_ler_documento/sei_alterar_documento_externo/
                # sei_criar_documento_externo/sei_incluir_documento_externo: MCP API needs all
                # fields individually; _ler_documento_via_backend still has 7 params
]
"src/todos/tools/processos.py" = [
    "PLR0913",  # sei_criar_processo (7 business fields) + sei_alterar_processo: MCP API surface
]
"src/todos/tools/analise.py" = [
    "ASYNC109",  # timeout é parâmetro MCP público — não pode ser substituído por asyncio.timeout()
]
"tests/**" = ["S101", "ANN", "D", "PLR2004", "SLF001", "FBT003"]  # assert/no-annot/no-docstring/magic-vals/bool-args ok in tests
"evals/**" = ["S101", "ANN", "D", "PLR2004", "PLR0913", "SLF001", "FBT003", "INP001", "ARG"]  # same relaxations as tests/

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["tests", "evals"]
markers = [
    "eval: marks eval tests that require ANTHROPIC_API_KEY",
]

[tool.vulture]
min_confidence = 80
paths = ["src/"]

[tool.bandit]
skips = [
    "B101",  # assert ok in non-test code here
    "B104",  # 0.0.0.0 intencional — deploy Railway/container
]
